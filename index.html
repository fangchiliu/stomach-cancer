<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Under Development</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --border: rgba(255,255,255,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      backdrop-filter: blur(10px);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.1;
      margin-bottom: 18px;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      text-decoration: none;
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 600;
      transition: 0.2s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">

      <div class="badge">🚧 Under Development</div>

      <h1>Your Project Name</h1>

      <p>
        This project is currently being built.  
        New features, documentation, and updates will be added soon.
      </p>

      <div class="buttons">
        <a class="btn btn-primary" href="https://github.com/YOUR_USERNAME/YOUR_REPO">
          View Repository
        </a>

        <a class="btn btn-secondary" href="#">
          Documentation Coming Soon
        </a>
      </div>

    </div>

    <footer>
      © 2026 Your Name • Built with GitHub Pages
    </footer>
  </div>

</body>
</html>
